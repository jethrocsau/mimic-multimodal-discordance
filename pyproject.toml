[project]
name = "mmd"
version = "0.1.0"
description = "Modality discordance across a zoo of multimodal models on the MIMIC-IV cardiac ICU cohort"
readme = "mmd/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "fsspec>=2024.2",
    "gcsfs>=2024.2",
    "google-cloud-bigquery>=3.17",
    "db-dtypes>=1.2",
    "typer>=0.12",
    "pillow>=10",
]

[project.scripts]
mmd = "mmd.cli:main"

# One group per model family: their library versions conflict, so exactly one is installed at a time,
#   uv sync --group hf-modern      (Gemma 3, Qwen2.5-VL; later Llama-3.2-Vision, LLaVA-1.5-HF)
#   uv sync --group llava-med      (then: uv run mmd setup llava-med --commit <sha>)
#   uv sync --group opentslm
# Plain `uv sync` installs the core only: cohort, analysis and the zoo table, no model code.
[dependency-groups]
llava-med = [
    "torch>=2.1,<2.6",              # pin to the torch version the existing LLaVA-Med runs used
    "numpy<2",                      # old torch / transformers 4.36 stack
    "pyarrow>=14,<18",              # newer pyarrow needs numpy 2 at import time
    "transformers==4.36.2",
    "tokenizers>=0.15,<0.16",
    "sentencepiece",
    "accelerate>=0.25,<0.30",
    "einops",
    "timm",
    "shortuuid",
    "bitsandbytes",
    "huggingface_hub>=0.20,<0.25",
]
hf-modern = [
    "torch>=2.4",
    "transformers>=4.53,<5",
    "accelerate>=1.0",
    "huggingface_hub>=0.30",
]
opentslm = [
    "torch>=2.4",
    "opentslm",
    "wfdb",
    "transformers==4.57.3",
    "huggingface_hub",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
conflicts = [
    [
        { group = "llava-med" },
        { group = "hf-modern" },
        { group = "opentslm" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmd"]
